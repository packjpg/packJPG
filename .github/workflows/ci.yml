name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    name: Linux (${{ matrix.cxx }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        cxx: [g++, clang++]
    steps:
      - uses: actions/checkout@v4

      - name: Build CLI, libraries, and run full test suite
        run: |
          make -C source clean
          make -C source all lib shared test CXX=${{ matrix.cxx }} -j2
          cat > /tmp/link_dll.cpp <<'CPP'
          #include "packjpglib.h"
          #include "packjpgdll.h"
          #include "codec_pipeline.h"
          int main() {
              const char* info = pjglib_version_info();
              pjglib_free(nullptr);
              std::vector<std::uint8_t> out;
              (void) packjpg::convert_memory(nullptr, 0, out);
              return (info != nullptr && info[0] != '\0' && PJGLIB_MSG_SIZE == 128) ? 0 : 1;
          }
          CPP
          ${{ matrix.cxx }} -std=c++17 -Isource /tmp/link_dll.cpp -Lsource -lpackJPG -Wl,-rpath,"$PWD/source" -o /tmp/link_dll
          /tmp/link_dll
          cat > /tmp/link_c_abi.c <<'C_EOF'
          #include "packjpglib.h"
          #include "packjpgdll.h"
          #include <string.h>
          int main(void) {
              const char* info = pjglib_version_info();
              const char* name = pjglib_short_name();
              pjglib_free(NULL);
              return (info != NULL && name != NULL && PJGLIB_MSG_SIZE == 128 && strncmp(name, "packJPG v", 9) == 0) ? 0 : 1;
          }
          C_EOF
          cc -std=c11 -Wall -Wextra -Werror -pedantic -Isource /tmp/link_c_abi.c -Lsource -lpackJPG -Wl,-rpath,"$PWD/source" -o /tmp/link_c_abi
          /tmp/link_c_abi

      - name: Test dev, install, and uninstall targets
        run: |
          make -C source clean
          make -C source dev CXX=${{ matrix.cxx }} -j2
          rm -f source/packJPG
          make -C source dev CXX=${{ matrix.cxx }} -j2
          test -x source/packJPG
          make -C source all CXX=${{ matrix.cxx }} -j2
          make -C source install CXX=${{ matrix.cxx }} DESTDIR=/tmp/stage PREFIX=/usr
          test -x /tmp/stage/usr/bin/packJPG
          make -C source uninstall DESTDIR=/tmp/stage PREFIX=/usr
          test ! -e /tmp/stage/usr/bin/packJPG

      - name: Static build, DEV_BUILD ASan/UBSan, and ASan/UBSan test suite (g++)
        if: matrix.cxx == 'g++'
        run: |
          make -C source clean
          make -C source all shared CXX=g++ STATIC=1 -j2
          python3 tests/run_tests.py ./source/packJPG
          make -C source clean
          make -C source dev CXX=g++ \
            CXXFLAGS="-O1 -g -Wall -pedantic -fsanitize=address,undefined -fno-omit-frame-pointer" \
            LDFLAGS="-fsanitize=address,undefined" -j2
          python3 - <<'PY'
          import base64, json, pathlib, subprocess, tempfile, zlib
          corpus = json.loads(pathlib.Path("tests/golden_corpus.json").read_text())
          first_case = next(iter(corpus["cases"].values()))
          with tempfile.TemporaryDirectory() as td:
              td_p = pathlib.Path(td)
              jpg = td_p / "sample.jpg"
              jpg.write_bytes(zlib.decompress(base64.b64decode(first_case["jpg_zb64"])))
              subprocess.run(["./source/packJPG", "-np", "-dev", "-o", "-t3", "-s12", "-ver", str(jpg)], check=True)
              pjg = td_p / "sample.pjg"
              assert pjg.is_file()
              for flag in ["-info", "-pgm", "-split", "-zdst", "-dist", "-coll0", "-fcol0"]:
                  subprocess.run(["./source/packJPG", "-np", "-dev", "-o", flag, str(jpg), str(pjg)], check=True)
          PY
          make -C source clean
          make -C source test CXX=g++ \
            CXXFLAGS="-O1 -g -Wall -pedantic -fsanitize=address,undefined -fno-omit-frame-pointer" \
            LDFLAGS="-fsanitize=address,undefined" -j2
          make -C source clean

      - name: Unsigned-char (ARM64 ABI) ASan/UBSan test suite (clang++)
        if: matrix.cxx == 'clang++'
        run: |
          make -C source clean
          make -C source test CXX=clang++ \
            CXXFLAGS="-O1 -g -Wall -pedantic -Werror=tautological-constant-out-of-range-compare -funsigned-char -fsanitize=address,undefined -fno-omit-frame-pointer" \
            LDFLAGS="-fsanitize=address,undefined" -j2
          make -C source clean

  macos:
    name: macOS
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build CLI, Makefile_osx, libraries, and run test suite
        run: |
          make -C source clean
          make -C source all lib shared test -j2
          test -f source/packJPGlib.a
          test -f source/libpackJPG.dylib
          make -C source -f Makefile_osx clean
          make -C source -f Makefile_osx all -j2
          make -C source clean
          make -C source dev -j2
          make -C source clean

  windows:
    name: Windows (${{ matrix.msystem }})
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    strategy:
      fail-fast: false
      matrix:
        include:
          - msystem: MINGW64
            pkg_prefix: mingw-w64-x86_64
          - msystem: MINGW32
            pkg_prefix: mingw-w64-i686
    steps:
      - uses: actions/checkout@v4

      - uses: msys2/setup-msys2@v2
        with:
          msystem: ${{ matrix.msystem }}
          path-type: inherit
          update: true
          install: >-
            make
            ${{ matrix.pkg_prefix }}-gcc
            ${{ matrix.pkg_prefix }}-binutils

      - name: Build CLI (with windres icons.res), libraries, C11/C++ DLL checks, and run test suite
        run: |
          make -C source clean
          make -C source all lib shared test PYTHON=python -j2
          test -f source/icons.res
          test -f source/packJPG.exe
          test -f source/packJPGlib.a
          test -f source/packJPG.dll
          test -f source/libpackJPG.a
          cat > source/test_dll_c_abi.c <<'C_EOF'
          #include "packjpglib.h"
          #include "packjpgdll.h"
          #include <string.h>
          int main(void) {
              const char* name = pjglib_short_name();
              pjglib_free(NULL);
              return (name != NULL && PJGLIB_MSG_SIZE == 128 && strncmp(name, "packJPG v", 9) == 0) ? 0 : 1;
          }
          C_EOF
          gcc -std=c11 -Wall -Wextra -Werror -pedantic -Isource source/test_dll_c_abi.c -Lsource -lpackJPG -o source/test_dll_c_abi.exe
          ./source/test_dll_c_abi.exe
          rm -f source/test_dll_c_abi.c source/test_dll_c_abi.exe

      - name: Build and test IrfanView & Susie .pjg plug-in (contrib/irfanview)
        run: |
          make -C contrib/irfanview clean
          make -C contrib/irfanview all test -j2
          make -C contrib/irfanview clean

      - name: Verify dev and clean targets
        run: |
          make -C source clean
          make -C source dev -j2
          make -C source clean
          test ! -e source/icons.res
          test ! -e source/packJPG.exe
