jobs:
  build-windows:
    name: Build Windows (${{ matrix.asset }})
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    strategy:
      fail-fast: false
      matrix:
        include:
          - msystem: MINGW64
            pkg_prefix: mingw-w64-x86_64
            asset: packJPGx64.exe
          - msystem: MINGW32
            pkg_prefix: mingw-w64-i686
            asset: packJPG.exe
    steps:
      - uses: actions/checkout@v4

      - uses: msys2/setup-msys2@v2
        with:
          msystem: ${{ matrix.msystem }}
          update: true
          install: >-
            make
            ${{ matrix.pkg_prefix }}-gcc
            ${{ matrix.pkg_prefix }}-binutils

      - name: Compile and smoke-test ${{ matrix.asset }}
        run: |
          make -C source clean all -j2
          mkdir -p dist
          cp source/packJPG.exe "dist/${{ matrix.asset }}"
          printf '%s' "$FIXTURE_JPG_B64" | tr -d ' \n' | base64 --decode > smoke.jpg
          "./dist/${{ matrix.asset }}" -np -ver -o smoke.jpg
          rm -f smoke.jpg smoke.pjg

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: dist/${{ matrix.asset }}

  build-linux:
    name: Build Linux (x86_64 static)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Compile and smoke-test packJPG-linux-x86_64
        run: |
          make -C source clean all STATIC=1 -j2
          mkdir -p dist
          cp source/packJPG dist/packJPG-linux-x86_64
          chmod 755 dist/packJPG-linux-x86_64
          printf '%s' "$FIXTURE_JPG_B64" | tr -d ' \n' | base64 --decode > /tmp/smoke.jpg
          ./dist/packJPG-linux-x86_64 -np -ver -o /tmp/smoke.jpg

      - uses: actions/upload-artifact@v4
        with:
          name: packJPG-linux-x86_64
          path: dist/packJPG-linux-x86_64

  build-macos:
    name: Build macOS (universal)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Compile and smoke-test packJPG-macos-universal
        run: |
          make -C source clean all \
            CXXFLAGS="-O3 -Wall -pedantic -funroll-loops -ffast-math -fomit-frame-pointer -arch x86_64 -arch arm64" \
            LDFLAGS="-arch x86_64 -arch arm64" -j2
          strip -x source/packJPG
          lipo -info source/packJPG
          mkdir -p dist
          cp source/packJPG dist/packJPG-macos-universal
          chmod 755 dist/packJPG-macos-universal
          printf '%s' "$FIXTURE_JPG_B64" | tr -d ' \n' | base64 --decode > /tmp/smoke.jpg
          ./dist/packJPG-macos-universal -np -ver -o /tmp/smoke.jpg

      - uses: actions/upload-artifact@v4
        with:
          name: packJPG-macos-universal
          path: dist/packJPG-macos-universal

  package:
    name: Bundle Checksums & Release
    needs: [build-windows, build-linux, build-macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Generate SHA256SUMS.txt
        working-directory: release-assets
        run: |
          chmod 755 packJPG-linux-x86_64 packJPG-macos-universal
          sha256sum packJPGx64.exe packJPG.exe packJPG-linux-x86_64 packJPG-macos-universal | tee SHA256SUMS.txt

      - uses: actions/upload-artifact@v4
        with:
          name: packJPG-release-bundle
          path: release-assets/*

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            release-assets/packJPGx64.exe
            release-assets/packJPG.exe
            release-assets/packJPG-linux-x86_64
            release-assets/packJPG-macos-universal
            release-assets/SHA256SUMS.txt
