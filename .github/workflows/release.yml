name: Release

on:
  push:
    tags:
      - '2.*'
      - 'v2.*'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-windows:
    name: Build Windows (${{ matrix.asset }})
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    strategy:
      fail-fast: false
      matrix:
        include:
          - msystem: MINGW64
            pkg_prefix: mingw-w64-x86_64
            asset: packJPGx64.exe
            iv_dll: PackJPGx64.dll
            spi_dll: ifpjg.sph
            plugin_zip: packJPG-irfanview-x64.zip
          - msystem: MINGW32
            pkg_prefix: mingw-w64-i686
            asset: packJPG.exe
            iv_dll: PackJPGx86.dll
            spi_dll: ifpjg.spi
            plugin_zip: packJPG-irfanview-x86.zip
    steps:
      - uses: actions/checkout@v4

      - uses: msys2/setup-msys2@v2
        with:
          msystem: ${{ matrix.msystem }}
          path-type: inherit
          update: true
          install: >-
            make
            ${{ matrix.pkg_prefix }}-gcc
            ${{ matrix.pkg_prefix }}-binutils

      - name: Compile and verify ${{ matrix.asset }} and ${{ matrix.plugin_zip }}
        run: |
          make -C source clean
          make -C source all lib -j2
          mkdir -p dist
          cp source/packJPG.exe "dist/${{ matrix.asset }}"
          python tests/run_tests.py "./dist/${{ matrix.asset }}"

          make -C contrib/irfanview clean
          make -C contrib/irfanview all test -j2
          python -c "import zipfile; z = zipfile.ZipFile('dist/${{ matrix.plugin_zip }}', 'w', zipfile.ZIP_DEFLATED); z.write('contrib/irfanview/${{ matrix.iv_dll }}', '${{ matrix.iv_dll }}'); z.write('contrib/irfanview/${{ matrix.spi_dll }}', '${{ matrix.spi_dll }}'); z.write('contrib/irfanview/README.md', 'README.md'); z.close()"

      - uses: actions/upload-artifact@v4
        with:
          name: dist-windows-${{ matrix.msystem }}
          path: |
            dist/${{ matrix.asset }}
            dist/${{ matrix.plugin_zip }}

  build-linux:
    name: Build Linux (x86_64 static)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Compile and verify packJPG-linux-x86_64
        run: |
          make -C source clean
          make -C source all STATIC=1 -j2
          mkdir -p dist
          cp source/packJPG dist/packJPG-linux-x86_64
          chmod 755 dist/packJPG-linux-x86_64
          python3 tests/run_tests.py ./dist/packJPG-linux-x86_64

      - uses: actions/upload-artifact@v4
        with:
          name: dist-packJPG-linux-x86_64
          path: dist/packJPG-linux-x86_64

  build-macos:
    name: Build macOS (universal)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Compile and verify packJPG-macos-universal
        run: |
          make -C source clean
          make -C source all \
            CXXFLAGS="-O3 -Wall -pedantic -funroll-loops -fomit-frame-pointer -arch x86_64 -arch arm64" \
            LDFLAGS="-arch x86_64 -arch arm64" -j2
          strip -x source/packJPG
          lipo -info source/packJPG
          mkdir -p dist
          cp source/packJPG dist/packJPG-macos-universal
          chmod 755 dist/packJPG-macos-universal
          python3 tests/run_tests.py ./dist/packJPG-macos-universal

      - uses: actions/upload-artifact@v4
        with:
          name: dist-packJPG-macos-universal
          path: dist/packJPG-macos-universal

  package:
    name: Bundle Checksums & Release
    needs: [build-windows, build-linux, build-macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: 'dist-*'
          path: release-assets
          merge-multiple: true

      - name: Generate SHA256SUMS.txt
        working-directory: release-assets
        run: |
          chmod 755 packJPG-linux-x86_64 packJPG-macos-universal
          sha256sum \
            packJPGx64.exe \
            packJPG.exe \
            packJPG-irfanview-x64.zip \
            packJPG-irfanview-x86.zip \
            packJPG-linux-x86_64 \
            packJPG-macos-universal | tee SHA256SUMS.txt

      - uses: actions/upload-artifact@v4
        with:
          name: packJPG-release-bundle
          path: release-assets/*

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            release-assets/packJPGx64.exe
            release-assets/packJPG.exe
            release-assets/packJPG-irfanview-x64.zip
            release-assets/packJPG-irfanview-x86.zip
            release-assets/packJPG-linux-x86_64
            release-assets/packJPG-macos-universal
            release-assets/SHA256SUMS.txt
